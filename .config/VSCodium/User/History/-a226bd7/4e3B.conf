# TIME HOURS
label {
    monitor =
    text = cmd[update:60000] date +"%H"
    font_size = 200
    font_family = Iosevka Nerd Font Heavy
    color = $tertiary_container
    

    position = 0, -90
    halign = center
    valign = top
}

# TIME Minutes
label {
    monitor =
    text = cmd[update:60000] date +"%M"
    font_size = 200
    font_family = Iosevka Nerd Font Heavy
    color = $tertiary_fixed_dim
    

    position = 40, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $secondary_fixed
    font_size = 16
    font_family = $font
   

    position = 0, -200
    halign = center
    valign = center
}


input-field {
    monitor =
    size = 10%, 4%
    outline_thickness = 1
    inner_color = rgba(2f3436ff)
   
    outer_color = rgba(0, 0,0,0)
    check_color = rgba(2f3436ff)
    fail_color = rgba(2f3436ff)

    font_color = rgb(170, 170, 170)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    # uncomment if you wish to display a message during authentication
    # check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3
    dots_center = true

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 340
    halign = center
    valign = bottom
}




label {
    monitor =
    text = cmd[update:200] awk '{print ($0?"Capslock":""); exit}' /sys/class/leds/input*::capslock/brightness
    color = rgb(170, 170, 170)
    font_family = $font
    font_size = 18
    position = 0, -100
    halign = center
    valign = center
}

