input-field {
    monitor =
    size = 12%, 4%
    outline_thickness = 1
    outer_color = $on_background

    inner_color = $tertiary_fixed_dim_opaque
    check_color = $tertiary_fixed_dim_opaque
    fail_color = $tertiary_fixed_dim_opaque

    font_color = $tertiary
    fade_on_empty = false
    rounding = 15

    font_family = $font
    # placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    # uncomment if you wish to display a message during authentication
    # check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.7
    dots_center = true

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 200
    halign = center
    valign = bottom
}




label {
    monitor =
    text = cmd[update:200] awk '{print ($0?"Capslock":""); exit}' /sys/class/leds/input*::capslock/brightness
    color = $on_background
    font_family = $font
    font_size = 12
    position = 0, 130
    halign = center
    valign = bottom
}

